remember:
  fields:
    text: {required: true, selector: {text: {multiline: true}}}
    title: {selector: {text: {}}}
    shelf: {example: "projects/pebble", selector: {text: {}}}
    key: {example: "garage door|code", selector: {text: {}}}
    kind: {example: note, selector: {select: {options: [note, fact, task, procedure, episode]}}}
    tags: {selector: {text: {multiple: true}}}
recall:
  fields:
    query: {required: true, selector: {text: {}}}
    shelf: {selector: {text: {}}}
    limit: {default: 5, selector: {number: {min: 1, max: 25}}}
show_link: {}
person_link:
  fields:
    person: {required: true, example: Dana, selector: {text: {}}}
    scope: {default: write, selector: {select: {options: [read, write, admin]}}}
    days: {default: 90, selector: {number: {min: 0, max: 3650}}}
call:
  fields:
    path: {required: true, example: "/api/pantry/add", selector: {text: {}}}
    method: {example: POST, selector: {select: {options: [GET, POST]}}}
    body: {example: '{"text": "chicken and eggs"}', selector: {object: {}}}
