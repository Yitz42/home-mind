configuration:
  models:
    name: Models
    description: >-
      Models Home Mind can use. type ha_ai_task uses a Home Assistant AI Task entity (your Haiku, no extra key);
      ollama / openai use a computer on your network (url like http://192.168.1.50:11434, plus model name);
      anthropic calls Claude directly (needs api_key and model).
  update_url:
    name: Update manifest
    description: Where to look for new knowledge packs.
  auto_update_packs:
    name: Install new packs automatically
  auto_test_hours:
    name: Run brain tests every N hours
    description: 0 = off. Runs the no-model tests on a schedule to track the trend.
  fade_days:
    name: Fade unused notes after N days
    description: Unused notes and episodes are ranked lower (never deleted). 0 = off.
  log_level:
    name: Log level
  comfort:
    name: Bedroom comfort brain
    description: >-
      Learn from cold/hot/just-right votes and write the comfort variables (mind_target_temp, sleep and wake
      temperature, fan, humidity). It only acts while input_boolean.mind_comfort_enabled is on.
  home:
    name: Watch the house
    description: File changes from Home Assistant (lights, fan, humidifier, heater, room, air, watch and phone readings) into memory, and give models the live state of what a question names.
  home_controls:
    name: Things the brain may control
    description: Entity ids (or domain.* like script.*). Empty = main lights, Dyson fan, humidifier, desk outlets, scripts, scenes. Controls only work while input_boolean.mind_control_enabled is on.
  home_fan_max:
    name: Highest fan speed the brain may set (%)
  fallback:
    name: Fallback models
    description: Names of models to try, in order, when the chosen one fails or is too slow. If none answers, Home Mind gives the best matching note.
  voice_seconds:
    name: Voice time limit (seconds)
    description: The longest a voice question may take before Home Mind falls back.
network:
  8099/tcp: Direct API (token in /data/token). Leave empty unless another computer needs it.
