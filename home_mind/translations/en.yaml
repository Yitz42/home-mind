configuration:
  models:
    name: Models
    description: >-
      Models Home Mind can use. type ha_ai_task uses a Home Assistant AI Task entity (your Haiku, no extra key);
      ollama / openai use a computer on your network (url like http://192.168.1.50:11434, plus model name);
      anthropic calls Claude directly (needs api_key and model). Optional price_in and price_out (dollars per
      million tokens) let Home Mind show what each model costs; none are built in because prices change.
      For a computer that sleeps or restarts: its models are checked every 30 seconds and skipped while it's
      away (connect_timeout, default 4 s). Ollama only: num_gpu (0 = on that computer's CPU, leaving the GPU to
      Voicebox), keep_alive (how long it stays loaded, e.g. 10m, 0, -1), num_ctx, num_thread.
  update_url:
    name: Update manifest
    description: Where to look for new knowledge packs (procedures written by a large model). Change it only if you host your own packs.
  auto_update_packs:
    name: Install new packs automatically
    description: Every 12 hours, install packs from the update manifest without asking. Packs are sha256-checked but only signature-checked once a key is in pack_keys.txt; off = check only, install from the Updates tab.
  auto_test_hours:
    name: Run brain tests every N hours
    description: 0 = off. Runs the no-model tests on a schedule to track the trend.
  fade_days:
    name: Fade unused notes after N days
    description: Unused notes and episodes are ranked lower (never deleted). 0 = off.
  log_level:
    name: Log level
    description: How much the app's Log tab shows. debug is for tracking down a problem.
  comfort:
    name: Bedroom comfort brain
    description: >-
      Learn from cold/hot/just-right votes and write the comfort variables (mind_target_temp, sleep and wake
      temperature, fan, humidity). It only acts while input_boolean.mind_comfort_enabled is on.
  home:
    name: Watch the house
    description: File changes from Home Assistant (lights, fan, humidifier, heater, room, air, watch and phone readings) into memory, and give models the live state of what a question names.
  home_controls:
    name: Things the brain may control
    description: >-
      Entity ids (or domain.* like script.*) models may switch when asked. Set this yourself: empty = the
      author's own devices plus every script.* and scene.*, so on your house it means all scripts and scenes.
      Nothing is controlled until you create a Toggle helper input_boolean.mind_control_enabled and turn it on;
      locks, alarms, valves and garage doors also need the person's confirmation each time.
  home_fan_max:
    name: Highest fan speed the brain may set (%)
    description: A fan asked to go higher is set to this. 0 = the brain may not run fans.
  fallback:
    name: Fallback models
    description: Names of models to try, in order, when the chosen one fails or is too slow. If none answers, Home Mind gives the best matching note.
  voice_seconds:
    name: Voice time limit (seconds)
    description: The longest a voice question may take before Home Mind falls back.
  morning_time:
    name: Morning summary time
    description: When to send the daily summary of what was filed (HH:MM, 24-hour).
  morning_notify:
    name: Morning summary goes to
    description: A notify service such as notify.mobile_app_my_phone. Empty = your first phone in the Home Assistant app.
  morning_enabled:
    name: Send the morning summary
    description: Off skips the daily send. Also a switch in Home Assistant (Home Mind device).
  evening_enabled:
    name: Send the evening home brief
    description: What happened in the house today (notable changes, automations, comfort, what was learned). Also a switch on the Home Mind device.
  evening_time:
    name: Evening brief time
    description: HH:MM. Nothing is sent on a day with nothing notable.
  evening_notify:
    name: Evening brief goes to
    description: A notify service. Empty = the same as the morning summary.
  house_notices:
    name: Notices about unusual house events
    description: A phone notice for very few things (a lock opened at an unusual hour, a reading far outside its usual range), at most one a day for each.
  people:
    name: People
    description: "Who lives here, so Home Mind knows who is speaking: name, and any of ha_users (Home Assistant user names or IDs), devices (phone or satellite device IDs), areas (rooms where only they have a satellite), persons (their person entities), each comma-separated, and notify (their phone, e.g. notify.mobile_app_their_phone: private answers and slow voice answers go there). Signed-in users are recognised from person entities with no setup. Once anyone is listed, overnight learning skips voices it can't recognise."
  personal_rule:
    name: Personal notes
    description: first_person = what a known person files about themselves ("my", "I") is theirs alone; household = everything is shared.
  unknown_caller:
    name: Calls with no speaker
    description: admin = calls that say nothing about who is asking (the panel, Claude, the API) see everything, personal notes and secrets included; guest = they see household notes only. Choose guest if anyone besides you can reach the panel or a token.
  embed_model:
    name: Embedding model (search by meaning)
    description: One of your models, type ollama or openai, used to make embeddings, so "planter" finds "flower box". Give that model an embed_model field (e.g. nomic-embed-text, all-minilm) or its model is used. Empty = keyword search only.
  comfort_rooms:
    name: Comfort rooms
    description: "Rooms the comfort brain runs, each learning from its own votes: name, person, and the entities climate, temp_sensor, humidifier, fan, phone_battery, alarm; signals (body signals, e.g. hrv=input_number.steady_hrv, steps=sensor.my_steps) and helpers it writes (enabled, target, fan, humidity, min, max, hum_min, hum_max, sleep, wake = input_number/input_boolean entities), comma-separated key=entity. Empty = the original bedroom setup. GET /api/comfort/check?room=NAME lists entities Home Assistant doesn't have."
  encrypt_secrets:
    name: Encrypt secrets
    description: Codes, passwords and other notes marked secret are stored encrypted, with the key in /data/vault.key, which Home Assistant backups leave out. Keep a copy of the key (Home Mind › /api/vault/key); without it sealed secrets can't be read. Turning this off opens them again.
  backup_target:
    name: Off-site backup
    description: folder (a path such as /media/home-mind or a NAS share), webdav (a URL) or s3 (a bucket URL). Empty = Home Assistant backups only.
  backup_url:
    name: Backup folder or URL
    description: The folder path (folder), the WebDAV address (webdav) or the bucket URL such as https://s3.amazonaws.com/my-bucket (s3).
  backup_user:
    name: Backup user (or S3 access key)
    description: For webdav and s3. Empty for a folder.
  backup_password:
    name: Backup password (or S3 secret key)
    description: For webdav and s3. Empty for a folder.
  backup_passphrase:
    name: Backup passphrase
    description: Off-site backups are encrypted with this; you need it to restore (tools/restore_backup.py). Required for webdav and s3.
  backup_region:
    name: S3 region
    description: For s3 only, for example us-east-1.
  backup_every_hours:
    name: Back up every (hours)
    description: Only when the memory has changed.
  backup_keep:
    name: Backups to keep
    description: Older off-site backups are deleted.
  learn_filing:
    name: Learn where notes go
    description: Notes that would land in the inbox are filed on the shelf notes like them are on, when that's clear; otherwise the shelf is suggested in the inbox review. Moving a note teaches it.
  docs_folder:
    name: Documents folder
    description: PDF, text, Markdown and HTML files here (manuals, warranties, recipes) are read every hour and searched for questions, each answer naming the document and page.
  homebox_url:
    name: Homebox URL
    description: Your Homebox (inventory) server, asked at question time about things and where they are.
  homebox_token:
    name: Homebox token
    description: An API token from your Homebox user settings.
  paperless_url:
    name: Paperless-ngx URL
    description: Your Paperless-ngx server, asked at question time about receipts, warranties and other papers.
  paperless_token:
    name: Paperless-ngx API token
    description: From your Paperless-ngx profile (My Profile › API Auth Token).
  rerank_model:
    name: Re-ranking model
    description: One of your models re-orders the top notes for typed questions before the answer is written (not for voice). Empty = search's own order.
  librarian_model:
    name: Memory graph librarian model
    description: Optional small model that routes typed questions to categories and entities in the memory graph before retrieval (not used for voice). Empty = fast built-in SQLite router.
  rule_planner:
    name: Plain commands without a model
    description: Read plain house commands ("kitchen light off", "den lamp to 40%", "lights off and lock up") directly, with no model. Anything it can't read with certainty goes to the models as before.
  control_model:
    name: Local control model
    description: A small function-calling model trained on your house (see "A small local model for house control" in the docs). House requests go to it first; anything it can't place goes to your normal model. Empty = off.
  model_mode:
    name: Model mode
    description: "cloud: the cloud model (Haiku) plans and answers. balanced: your local model handles the kinds of house request it has earned (and you approved), the cloud model the rest. private: nothing leaves the house; if the home computer is asleep, Home Mind says so."
  confidence_dial:
    name: Confidence line
    description: Below this (0 to 1), a house request planned by the local model goes to the cloud model, and otherwise Home Mind asks "Just to check..." before acting. /api/calibration suggests a line from what actually happened.
  local_model:
    name: Local model for answers
    description: A chat model on your own computer (for example a 4B model in Ollama) that writes answers in private mode. Empty = in private mode, answers come from your notes alone.
  shadow_rate:
    name: Shadow share
    description: The share of house requests also planned by a second model in the background (Haiku if your local model planned it, your local model if Haiku did), never acting, to measure which is right more often. 0 = off; 0.1 = one in ten. It costs a model call each.
  approval_phone:
    name: Phone for approvals
    description: The phone that approves locks, garage doors, alarms and heaters (for example notify.mobile_app_my_phone). Approve needs Face ID or the passcode on iPhone. Empty = the first phone with the Home Assistant app.
  safety_contact:
    name: Safety contact
    description: Someone to tell when you describe an emergency, a double dose or a big decline (a notify service, for example notify.mobile_app_partner). Only if you want that. Empty = no one is told.
  ha_user_token:
    name: Home Assistant user token (limited)
    description: A long-lived token from a non-admin Home Assistant user made for Home Mind. Device control and readings then use that user instead of the add-on's admin access (automation set-up still uses the admin access). Empty = admin access, as before.
  ha_url:
    name: Home Assistant address for that token
    description: Where Home Mind reaches Home Assistant with the limited token. Empty = http://homeassistant:8123.
  markdown_folder:
    name: Markdown folder (two-way sync)
    description: Every note as a Markdown file, one folder per shelf (for example /share/home-mind/notes). Edit a file to change the note, add a file to add a note, delete one to archive it. Empty = off.
  markdown_minutes:
    name: Markdown sync every (minutes)
    description: How often the Markdown folder and the memory are synced both ways.
  compare_models:
    name: Models to compare
    description: Models that answer the same test questions on a schedule. Empty = every connected model.
  compare_days:
    name: Compare models every (days)
    description: 0 = off. Results on the Tests tab, at /api/compare and as a sensor per model.
  compare_suites:
    name: Suites for the model comparison
    description: Test suites the compared models answer (names from the Tests tab, such as recall, tricky, hard).
  use_preferences:
    name: Use learned settings
    description: When you ask to turn on a light or fan without saying how much, use the brightness or speed you usually choose at this time of day.
  telegram_token:
    name: Telegram bot token
    description: From @BotFather. Ask and tell Home Mind from Telegram. Empty = off. Questions and answers go through Telegram's servers; only chats listed below are answered.
  telegram_chats:
    name: Telegram chats allowed
    description: 'One per line as "chat id: name" (the name from People). Send /start to the bot to see your chat id. Anyone in a listed chat can ask and file notes as that person.'
  web_search:
    name: Web lookups
    description: For questions about current facts the memory can't answer. off, searxng (your own SearXNG) or brave (Brave Search API). Only the question is sent, never one with a secret or a household name. Results are web pages, shown to the model as data, never as instructions.
  web_search_url:
    name: SearXNG address
    description: For web_search searxng, for example http://192.168.1.20:8888 (JSON output must be on in its settings).
  web_search_key:
    name: Brave Search API key
    description: For web_search brave. The question leaves your network to Brave.
  email_host:
    name: Email (IMAP) server
    description: A mailbox Home Mind reads (TLS). Forward receipts, warranties and notes to it. Use a mailbox made for Home Mind, not your own; mail that reads like instructions is held for review.
  email_user:
    name: Email user
    description: The mailbox's login, usually its address.
  email_password:
    name: Email password
    description: The mailbox's password (an app password if the provider asks for one).
  email_folder:
    name: Email folder
    description: The folder read, usually INBOX. Read mail is marked seen.
  email_senders:
    name: Email senders allowed
    description: Only mail from these addresses is read. Empty = no mail is read. A From address can be forged, so list only your own.
  email_require_verified:
    name: Only verified email
    description: Read mail only when your mail server says it passed its sender check (DKIM or SPF for the sender's domain). A From line alone can be forged. Turn off only if your server doesn't add Authentication-Results.
  email_authserv_id:
    name: Your mail server's name in Authentication-Results
    description: The name your mail server puts first in its Authentication-Results header (for example mx.google.com). Only that header is trusted; left empty, the topmost one is.
  exertion_zones:
    name: Live exertion zones
    description: Off by default. When on, a fresh heart-rate reading above the line puts you in the upper zone; on a low day one neutral notice at most ("Heart's up. Rest when you can."), none on a rough day. Switches itself off if a beta-blocker or ivabradine is logged. Heart rate misses mental and emotional effort.
  exertion_threshold:
    name: Exertion line (bpm)
    description: The heart rate from your clinician's pacing plan. 0 = your resting heart rate + 15.
  other_assistants:
    name: Other assistants as front ends
    description: 'How another assistant reaches Home Mind and its name, as "key: name": the key is its front_end name, its Home Assistant user id or a device id (for example "u_alexa_bridge: Alexa"). They are treated as guests: lights and media only, nothing about health, money, location, rooms or things, and safety replies go to your phone.'
  firefly_url:
    name: Firefly III address
    description: Your Firefly III (personal finance), read-only. Only this month's totals are read, every 15 minutes, and said by code (never a model) to its owner only.
  firefly_token:
    name: Firefly III token
    description: A personal access token from Firefly III (Options > Profile > OAuth).
  firefly_owner:
    name: Whose money it is
    description: The person (from the people option) who may hear the Firefly III totals. Empty = nobody by voice.
  connected_answers:
    name: Connected answers
    description: Questions like "why am I so gassy lately?", "how is my health looking?" or "is my week really busy?" are answered from a brief of your own data (readings against your usual, check-ins, symptoms you mentioned, new medicines, meals, the calendar) plus the general causes, connected by a model. Every number is checked against the brief.
  deep_model:
    name: Model for connected answers
    description: The model that connects the brief (a stronger one helps, e.g. a Sonnet model). Empty uses the usual chain. Private mode always stays on local models.
  compare_answers:
    name: Show the quick answer too
    description: Connected answers come with the quick answer beside them in the panel, and a tap says which was better, so you can judge the new path.
  proposals_model:
    name: Model for gap proposals
    description: An Anthropic model from your models list (for example Opus) asked through the Batch API, on nights when a gate failed or a gap is waiting, to draft the cheapest fix for something Home Mind keeps failing at. It sees only the schema and made-up data. Empty = proposals list the record and app fixes only.
  travel_away_entity:
    name: Away switch for travel mode
    description: An input_boolean (or similar) turned on in travel mode. Empty = input_boolean.away if you have one.
  monthly_spend_cap:
    name: Monthly cloud spend cap (dollars)
    description: Once this month's cloud model spend (for models with prices set) reaches this, cloud models aren't used until next month; answers come from local models or your notes. 0 = no cap. Set a hard limit on the API key too.
  email_minutes:
    name: Check email every (minutes)
    description: How often the mailbox is checked.
  label_url:
    name: Address for QR labels
    description: Where a scanned label opens, for example https://ha.example.com/hassio/ingress/local_home_mind. Empty = the address you are using the panel from.
  automation_pin:
    name: PIN for automations that open the house
    description: Drafted automations that unlock, open a garage door or disarm an alarm are installed only with this PIN. Empty = never.
  patterns_checkins:
    name: Fog check-ins
    description: Ask on the phone (tap buttons) when today's brain-fog rating or last night's sleep is missing.
  patterns_checkin_time:
    name: Check-in time
    description: When to ask if the fog rating or sleep is missing (HH:MM). One more try at the evening time.
  patterns_evening_time:
    name: Evening check-in time
    description: Second try for a missing fog rating (HH:MM).
  patterns_report_day:
    name: Weekly patterns report day
    description: 0 = Monday ... 5 = Saturday, 6 = Sunday.
  patterns_report_time:
    name: Weekly patterns report time
    description: When the weekly brain-fog patterns report is sent (HH:MM).
  calendar_quiet:
    name: Calendars to leave out
    description: Calendars kept in memory but left out of answers and the morning summary unless a question is about them.
  overnight_time:
    name: Overnight learning time
    description: When a local model reads the day's conversations with your assistant and files what you stated (HH:MM).
  overnight_model:
    name: Overnight learning model
    description: Name of the model that reads conversations at night. Empty = a model named qwen35b or qwen9b, else your first ollama model; with none, overnight learning is skipped. Skipped (and retried the next night) if its computer is off. A cloud model sees the conversations with secret values hidden.
  overnight_enabled:
    name: Overnight learning
    description: Off skips the nightly run (the button still runs it). Also a switch in Home Assistant (Home Mind device).
  knowledge_food:
    name: Food database
    description: Download USDA FoodData Central (about 450 MB once) so meal ideas use real protein and calories.
  knowledge_wikipedia:
    name: Offline Wikipedia
    description: Download English Wikipedia, text only (about 50 GB once), for general questions. Kept out of backups.
  knowledge_window:
    name: Download window
    description: When the big Wikipedia download may run (HH:MM-HH:MM); it pauses outside and resumes the next night.
  answer_edges:
    name: Repeat the best note before the question
    description: On long pages of notes, repeat the best current note right before the question (models read the start and end of a long page best). Off until the comparison script shows it helps your models.
  answer_notes_first:
    name: Name the notes before answering
    description: The model first lists the notes its answer comes from, then answers. Slower; never used for voice. Off until the comparison script shows it helps your models.
  events_keep_days:
    name: Keep the detailed activity log for (days)
    description: Older search, answer and change events are rolled up into daily counts and removed, and older house readings and device changes into one daily note per thing, so the database stops growing. Other notes are never touched. 0 = keep everything.
  quiet_hours:
    name: Quiet hours for phone notifications
    description: No phone pushes between the start and end times; they wait and are sent when quiet hours end. The Home Assistant notification list still gets them at once.
  quiet_start:
    name: Quiet hours start (HH:MM)
    description: Phone pushes wait from this time.
  quiet_end:
    name: Quiet hours end (HH:MM)
    description: Waiting phone pushes are sent at this time.
  notify_daily_cap:
    name: Most phone notifications a day
    description: After this many, the rest of the day's go only to the Home Assistant notification list. 0 = no limit.
  checkin_old_facts:
    name: Ask about old facts in the morning
    description: The morning summary asks about one old fact a day ("Still true?") with Still true / It changed buttons. Secret values are never shown.
  checkin_after_days:
    name: Ask about facts older than (days)
    description: A fact this old, and not confirmed or asked about within that time, can be asked about.
  overnight_structure:
    name: Overnight, read what the patterns missed
    description: The overnight model reads recent notes where the built-in patterns found no place, schedule, chore, details or who-is-who, and keeps only what it copies word for word from the note. Off until tests/compare_structure.py shows it helps your model and adds nothing wrong.
  router:
    name: Choose the model by the question
    description: When no model is named (the Ask box, Telegram, a voice agent that leaves it to Home Mind), simple lookups go to a local model first, harder questions (why, compare, plan, summarise) to the cloud model first, and private ones (health, money, personal notes) local first. Off = such questions get the best matching note, as before.
  router_local:
    name: Local models (router)
    description: Models on your own computers, tried first for simple and private questions. Empty = the fallback models that run on your network.
  router_cloud:
    name: Cloud models (router)
    description: Models tried first for harder questions. Empty = the other fallback models.
  db_snapshots:
    name: Database snapshots to keep
    description: One a day. If the database is ever damaged, Home Mind starts from the newest good one, tells you, and keeps the damaged file.
  away_alert_hours:
    name: Tell me when a model computer is away (hours)
    description: When a computer your models run on (e.g. the GPU laptop) hasn't answered for this long, one notification, and another when it's back. 0 = never.
  persona_model:
    name: Persona model
    description: A model that rewords answers in the persona's voice (a small one on a GPU computer, e.g. an Ollama qwen3:1.7b). Checked like the rules; slow (over 1.5 s spoken, 4 s written), asleep or a changed fact and the rules style it instead. Empty = rules only.
  phrasebook_grow:
    name: Grow the phrasebook overnight
    description: Each night the overnight model writes new odd ways of saying sleep and workouts. A case is kept only if it can be read, adds no number that wasn't said, and a second blind reading agrees; the rest wait for review on the Health tab.
network:
  8099/tcp: Direct API (token in /data/token). Leave empty unless another computer needs it.
