name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "aiohttp>=3.10,<4" "metaphone==0.6" "libzim>=3.4,<5" "numpy>=1.26,<3" "cryptography>=42" "pypdf>=4" jinja2 pyyaml
      - name: Health questions from the watch's readings
        run: python tests/test_health.py
      - name: Options and schema (as the Supervisor checks them)
        run: python tests/test_config.py
      - name: End to end (no Home Assistant)
        run: python tests/test_local.py
      - name: Comfort model
        run: python tests/test_comfort.py
      - name: Comfort controller (fake Home Assistant)
        run: python tests/test_comfort_live.py
      - name: Automation engine (fake Home Assistant)
        run: python tests/test_automations.py
      - name: Secrets kept from cloud models
        run: python tests/test_privacy.py
      - name: Controls for Home Assistant
        run: python tests/test_control.py
      - name: Answer quality (past days, low match, sources)
        run: python tests/test_answers.py
      - name: Upkeep (model use, event log, quiet hours, old facts)
        run: python tests/test_upkeep.py
      - name: Abilities (since when, repeating, chores, places, fields, who is who, corrections, duplicates)
        run: python tests/test_abilities.py
      - name: Lookups, backfill, due reminders, secrets, model-read structure
        run: python tests/test_holes.py
      - name: Trust and privacy (probation, deletion, bulk limits, attacks)
        run: python tests/test_trust.py
      - name: Source trust, review queue, tidying, reminders
        run: python tests/test_finish.py
      - name: House and automations (triggers, habits, ranges, notable changes, drafts, evening brief)
        run: python tests/test_house.py
      - name: LongMemEval harness (self-test on a sample in its format)
        run: python tests/longmemeval.py selftest
      - name: People and search keys (speaker, personal notes, unknown voices, keys)
        run: python tests/test_people.py
      - name: Meaning, links and categories (embeddings, modifiers, links, importance, fading)
        run: python tests/test_meaning.py
      - name: Claude with tools (look-ups when an answer didn't know)
        run: python tests/test_toolloop.py
      - name: Logs by date, codes from memory, the watch glance
        run: python tests/test_logs_codes.py
      - name: Security and setup (tokens, signatures, encryption, backups, comfort rooms)
        run: python tests/test_security.py
      - name: Files and filing (documents, filing, apps, pronoun links)
        run: python tests/test_files.py
      - name: Set 5 (prefix weight, link walk, evolve, rerank, profiles, languages)
        run: python tests/test_more.py
      - name: Set 6 (export, Markdown sync, SQL, views, comparison)
        run: python tests/test_share.py
      - name: Set 7 (preferences, reshelve, photos, labels, handoff)
        run: python tests/test_learn.py
      - name: Set 8 (Telegram, web lookups, email, caching)
        run: python tests/test_connect.py
      - name: Bug-hunting set (odd inputs, threads, old databases, failures)
        run: python tests/test_bugs.py
      - name: Local control model (training data, parsing, wiring)
        run: python tests/test_localctl.py
      - name: Plain commands without a model, several actions per request
        run: python tests/test_planner.py
      - name: Control accuracy (rule planner; floors)
        run: python tests/control_bench.py
      - name: Decision log, outcomes, replay (design phase 1)
        run: python tests/test_decisions.py
      - name: Safety layer (phase 2)
        run: python tests/test_safety.py
      - name: The conversation (phase 3)
        run: python tests/test_conversation.py
      - name: Measurement (phase 4)
        run: python tests/test_measure.py
      - name: Voice assistant (phase 5)
        run: python tests/test_voice.py
      - name: Model modes, confidence, now board (phase 6)
        run: python tests/test_deliberate.py
      - name: Learned house requests (phase 7)
        run: python tests/test_learned.py
      - name: Learned answers (phase 8)
        run: python tests/test_learned_answers.py
      - name: Outbox, forget list, check, test restore, rollback, model swap (phase 9)
        run: python tests/test_soundness.py
      - name: Channels, guest mode, spend cap, consent on a clear day (phase 10)
        run: python tests/test_channels.py
      - name: Rooms, access by room and group, back-off, surprises, conflicts (phase 11)
        run: python tests/test_rooms.py
      - name: Things and scenes from a description (phase 12)
        run: python tests/test_things.py
      - name: Trackers, medicines log, events, nudges, exertion zones, travel (phase 13)
        run: python tests/test_tracking.py
      - name: Experiments and proposals (phase 14)
        run: python tests/test_experiments.py
      - name: Other assistants, registers, views, Firefly III (phase 15)
        run: python tests/test_frontends.py
      - name: Ten design checks across phases 8 to 15
        run: python tests/test_design_checks.py
      - name: Connected answers
        run: python tests/test_connected.py
      - name: Talk in the panel
        run: python tests/test_talk.py
      - name: Direct Ask actions (notes, shopping, pantry, automations, calendar, timers, goals, system)
        run: python tests/test_ask_actions.py
      - name: Expert review checks
        run: for f in tests/test_review_*.py; do echo "== $f"; python "$f" || exit 1; done
      - name: Extraction bench scoring
        run: python tests/test_extract.py
      - name: Pantry
        run: python tests/test_pantry.py
      - name: Brain-fog patterns
        run: python tests/test_patterns.py
      - name: Check-ins by time
        run: python tests/test_checkins.py
      - name: Home page data
        run: python tests/test_hub.py
      - name: Knowledge (food database, offline Wikipedia)
        run: python tests/test_knowledge.py
      - name: Recipe nutrition converter (tools)
        run: python tests/test_convert_recipes.py
      - name: Today screen data
        run: python tests/test_today.py
      - name: Fitness goals, workouts, weekly review
        run: python tests/test_fitness.py
      - name: Sleep said in words, watch zeros
        run: python tests/test_sleeplog.py
      - name: Phrasebook (learning odd wordings)
        run: python tests/test_phrasebook.py
      - name: Persona (Jeeves, emotion markers)
        run: python tests/test_persona.py
      - name: Voice bridge (Voicebox, emotions, Piper fallback)
        run: python tests/test_voice_bridge.py
      - name: GPU computer as a model server (up/away, Ollama options, persona model)
        run: python tests/test_gpu_server.py
      - name: The house's time zone
        run: python tests/test_timezone.py
      - name: Data answers (computed, not guessed)
        run: python tests/test_datafacts.py
      - name: The router (local, cloud, private, escalation)
        run: python tests/test_router.py
      - name: MemGraph personal memory graph and Brain Graph visualizer
        run: python tests/test_memgraph.py
      - name: Database safety net
        run: python tests/test_dbguard.py
      - name: Brain suites on held-out worlds
        run: python tests/suites_check.py
      - name: Turnkey small-LLM training (control, persona, memgraph)
        run: python tests/test_trainer.py
      - name: House tiles and dashboards
        run: python tests/test_tiles.py
